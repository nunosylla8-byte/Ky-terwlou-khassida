<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>KY TERWLOU</title>
    <meta name="description" content="Lire, apprendre et répéter les khassaïdes de Serigne Touba">
    <meta name="theme-color" content="#0E5A43">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #F5F8F5;
            --card: #fff;
            --ink: #17231E;
            --mut: #5E6F67;
            --g: #0E5A43;
            --g2: #E1EFE8;
            --gold: #B8892B;
            --line: #D5E0DA;
            --bad: #B3261E
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0F1A16;
                --card: #17261F;
                --ink: #E8F0EB;
                --mut: #9DB0A6;
                --g: #4DBB92;
                --g2: #1F3A2F;
                --gold: #E0B04F;
                --line: #2B4137;
                --bad: #F2877F
            }
        }

        :root[data-theme="dark"] {
            --bg: #0F1A16;
            --card: #17261F;
            --ink: #E8F0EB;
            --mut: #9DB0A6;
            --g: #4DBB92;
            --g2: #1F3A2F;
            --gold: #E0B04F;
            --line: #2B4137;
            --bad: #F2877F
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit
        }

        html {
            font-size: var(--fs, 100%)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 1rem/1.5 "Source Sans 3", system-ui, sans-serif;
            overflow-x: hidden
        }

        img,
        video,
        iframe,
        audio {
            max-width: 100%
        }

        h1,
        h2,
        h3 {
            font-family: Amiri, Georgia, serif;
            margin: 0 0 .5rem;
            line-height: 1.2
        }

        h1 {
            font-size: 2rem
        }

        h2 {
            font-size: 1.5rem
        }

        h3 {
            font-size: 1.2rem
        }

        header {
            background: var(--g);
            color: #fff;
            padding: 0 1rem;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
            position: sticky;
            top: 0;
            z-index: 4
        }

        header .row {
            flex-wrap: nowrap;
            min-width: 0
        }

        header b {
            white-space: nowrap
        }

        header b {
            font: 700 1.6rem Amiri, serif;
            letter-spacing: .04em
        }

        header button {
            background: transparent;
            color: #fff;
            border: 1px solid #ffffff80
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: contain;
            background: #fff;
            flex: none
        }

        .ph {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--gold);
            color: var(--gold);
            font-size: .7rem;
            background: transparent
        }

        nav {
            display: flex;
            gap: .2rem;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            padding: 0 .5rem
        }

        nav button {
            display: flex;
            align-items: center;
            gap: .5rem;
            background: none;
            border: 0;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            color: var(--mut);
            padding: .8rem .9rem;
            font-weight: 600;
            white-space: nowrap
        }

        nav button.on {
            color: var(--g);
            border-color: var(--gold)
        }

        nav .sh {
            display: none
        }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 1.2rem 1.5rem 9rem
        }

        @media(min-width:1000px) {
            nav {
                position: fixed;
                top: 68px;
                left: 0;
                bottom: 0;
                width: 230px;
                flex-direction: column;
                gap: .3rem;
                border-right: 1px solid var(--line);
                border-bottom: 0;
                padding: 1rem .6rem;
                overflow-y: auto
            }

            nav button {
                border-bottom: 0;
                border-left: 4px solid transparent;
                border-radius: 8px;
                font-size: 1.05rem;
                text-align: left;
                width: 100%
            }

            nav button.on {
                background: var(--g2);
                border-left-color: var(--gold)
            }

            main {
                margin-left: 230px;
                max-width: none;
                padding: 1.5rem 2.5rem 6rem
            }

            #fm,
            #main {
                max-width: 920px
            }

            #panel {
                left: 230px
            }
        }

        @media(max-width:699px) {
            nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 6;
                border-top: 2px solid var(--gold);
                border-bottom: 0;
                padding: 0 0 env(safe-area-inset-bottom, 0px);
                gap: 0;
                justify-content: space-between
            }

            nav button {
                flex: 1;
                min-width: 0;
                flex-direction: column;
                gap: 0;
                padding: .45rem .1rem;
                border-bottom: 0;
                border-top: 3px solid transparent;
                font-size: .68rem;
                line-height: 1.2;
                justify-content: center;
                min-height: 58px
            }

            nav button.on {
                border-top-color: var(--gold);
                background: var(--g2)
            }

            nav .lg {
                display: none
            }

            nav .sh {
                display: inline
            }

            nav .ic {
                font-size: 1.25rem
            }

            main {
                padding: 1rem 1rem 8rem
            }

            #panel {
                bottom: calc(58px + env(safe-area-inset-bottom, 0px));
                padding-bottom: .8rem
            }

            header b {
                font-size: 1.25rem
            }

            .logo {
                width: 38px;
                height: 38px
            }

            h1 {
                font-size: 1.6rem
            }

            .card {
                padding: .85rem
            }

            .row>button:not(.sm),
            .row>a.btn:not(.sm) {
                flex: 1 1 auto;
                justify-content: center
            }

            input[type=date] {
                width: 100% !important
            }
        }

        @media(min-width:700px) and (max-width:999px) {
            main {
                padding: 1.2rem 1.5rem 8rem
            }

            nav button {
                padding: .9rem 1rem
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: .8rem
        }

        .row {
            display: flex;
            gap: .6rem;
            flex-wrap: wrap;
            align-items: center
        }

        .sp {
            justify-content: space-between
        }

        .grow {
            flex: 1;
            min-width: 150px
        }

        button,
        a.btn {
            font: inherit;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid var(--g);
            background: var(--g);
            color: #fff;
            padding: .55rem 1rem;
            min-height: 44px;
            text-decoration: none;
            display: inline-flex;
            align-items: center
        }

        button.sec,
        a.btn.sec {
            background: transparent;
            color: var(--g)
        }

        button.bad {
            background: transparent;
            color: var(--bad);
            border-color: var(--bad)
        }

        button.sm,
        a.btn.sm {
            min-height: 36px;
            padding: .3rem .7rem;
            font-size: .92rem
        }

        :is(button, input, select, textarea, a):focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }

        input,
        select,
        textarea {
            font: inherit;
            width: 100%;
            padding: .55rem .7rem;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
            color: var(--ink)
        }

        label {
            display: block;
            font-weight: 600;
            margin: .6rem 0 .2rem
        }

        label.ck {
            display: flex;
            gap: .5rem;
            align-items: center;
            font-weight: 400;
            margin: .2rem 0
        }

        label.ck input {
            width: auto;
            min-height: 0
        }

        .badge {
            display: inline-block;
            padding: .1rem .6rem;
            border-radius: 99px;
            background: var(--g2);
            color: var(--g);
            font-size: .85rem;
            font-weight: 600
        }

        .badge.w {
            background: #F6E8C4;
            color: #6B4E0E
        }

        .mut {
            color: var(--mut)
        }

        .empty {
            text-align: center;
            color: var(--mut);
            padding: 1.5rem;
            border: 2px dashed var(--line);
            border-radius: 10px;
            margin-bottom: .8rem
        }

        .bar {
            height: 8px;
            background: var(--g2);
            border-radius: 9px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--g)
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: .8rem
        }

        .num {
            font: 700 1.6rem Amiri, serif;
            color: var(--gold);
            min-width: 2rem
        }

        .done {
            opacity: .65
        }

        .done .t {
            text-decoration: line-through
        }

        #panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--card);
            border-top: 3px solid var(--gold);
            padding: .8rem 1rem calc(.8rem + env(safe-area-inset-bottom, 0px));
            z-index: 5;
            max-height: 80vh;
            overflow: auto
        }

        #panel iframe.yt {
            width: 100%;
            aspect-ratio: 16/9;
            border: 0;
            border-radius: 8px
        }

        #panel video {
            width: 100%;
            max-height: 50vh
        }

        #panel audio {
            width: 100%
        }

        .note {
            background: #F6E8C4;
            color: #4B3608;
            border-radius: 8px;
            padding: .6rem .9rem;
            margin-bottom: 1rem;
            font-size: .92rem
        }

        .err {
            background: #FBE3E0;
            color: #7A1710
        }

        textarea.code {
            font-family: ui-monospace, monospace;
            font-size: .82rem;
            min-height: 120px
        }

        .pr {
            display: none
        }

        @media print {

            header,
            nav,
            #panel,
            button,
            .noprint,
            a.btn,
            input,
            select {
                display: none !important
            }

            .pr {
                display: flex;
                gap: 1rem;
                align-items: center;
                border-bottom: 3px solid #B8892B;
                margin-bottom: 1rem
            }

            body {
                background: #fff;
                color: #000
            }

            .card {
                break-inside: avoid
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="row" id="hd"></div>
        <div class="row" style="flex:none"><button class="sm" onclick="tsize()"
                aria-label="Agrandir le texte">A+</button><button class="sm" onclick="theme()"
                aria-label="Changer de thème">Thème</button></div>
    </header>
    <nav id="nav"></nav>
    <main>
        <div id="fm" role="status"></div>
        <div id="main"></div>
    </main>
    <div id="panel" hidden></div>
    <script>
        const $ = s => document.querySelector(s);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, '').trim();
        const uid = () => Math.random().toString(36).slice(2, 10);
        const today = () => {const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10)};
        const fmt = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'});
        const DEF = {k: [], a: [], p: [], d: [], s: [], logo: ''}; let S;
        try {S = JSON.parse(localStorage.getItem('kyt') || 'null') || DEF} catch (e) {S = DEF} S = {...DEF, ...S};
        const save = () => {try {localStorage.setItem('kyt', JSON.stringify(S))} catch (e) {flash('Enregistrement impossible : espace de stockage plein ou bloqué.')} };
        try {const t = localStorage.getItem('kyt-th'); if (t) document.documentElement.dataset.theme = t} catch (e) { }
        function tsize() {const c = ['100%', '115%', '130%']; let i = c.indexOf(document.documentElement.style.getPropertyValue('--fs') || '100%'); i = (i + 1) % 3; document.documentElement.style.setProperty('--fs', c[i]); try {localStorage.setItem('kyt-fs', c[i])} catch (e) { } }
        try {const f = localStorage.getItem('kyt-fs'); if (f) document.documentElement.style.setProperty('--fs', f)} catch (e) { }
        function theme() {const r = document.documentElement, dk = r.dataset.theme ? r.dataset.theme == 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dk ? 'light' : 'dark'; try {localStorage.setItem('kyt-th', r.dataset.theme)} catch (e) { } }
        // fichiers (IndexedDB)
        const DBP = new Promise(r => {try {const q = indexedDB.open('kyt', 1); q.onupgradeneeded = () => q.result.createObjectStore('f'); q.onsuccess = () => r(q.result); q.onerror = () => r(null)} catch (e) {r(null)} });
        async function tx(m, fn) {const db = await DBP; if (!db) throw new Error('Stockage de fichiers indisponible sur ce navigateur.'); return new Promise((ok, ko) => {const t = db.transaction('f', m), r = fn(t.objectStore('f')); t.oncomplete = () => ok(r.result); t.onerror = () => ko(t.error)})}
        const fput = (id, b) => tx('readwrite', s => s.put(b, id)), fget = id => tx('readonly', s => s.get(id)), fdel = id => id ? tx('readwrite', s => s.delete(id)).catch(() => { }) : 0;
        async function store(file) {const id = uid(); await fput(id, file); return id}
        let V = 'home', Q = '', ED = null, SHOW = false, D = null, PD = null, PROP = null, MSG = '', AK = '', AE = null;
        const K = id => S.k.find(x => x.id == id), KN = id => (K(id) || {name: '(supprimé)'}).name, A = id => S.a.find(x => x.id == id), airsOf = kid => S.a.filter(a => a.kid == kid);
        const sdone = id => S.s.find(x => x.sid == id), isDone = id => (sdone(id) || {}).st == 'done';
        const ytId = u => {const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m && m[1]};
        function flash(t) {const f = $('#fm'); if (f) {f.innerHTML = t ? `<div class="note err">${esc(t)}</div>` : ''; if (t) scrollTo(0, 0)} }
        const NAVS = [['home', 'Accueil', '🏠', 'Accueil'], ['lib', 'Bibliothèque', '📚', 'Textes'], ['airs', 'Gestion des airs', '🎵', 'Airs'], ['prog', 'Mes programmes', '📅', 'Programmes'], ['dah', 'Dahiras', '👥', 'Dahiras'], ['set', 'Réglages', '⚙️', 'Réglages']];
        function go(v, x) {V = v; PD = x || null; PROP = null; SHOW = false; ED = null; if (v != 'pform') D = null; render(); scrollTo(0, 0)}
        const logoImg = c => S.logo ? `<img src="${S.logo}" alt="Logo" class="${c || 'logo'}">` : `<span class="${c || 'logo'} ph" title="Emplacement du logo officiel">Logo</span>`;
        function render() {
            $('#hd').innerHTML = logoImg() + '<b>KY TERWLOU</b>';
            $('#nav').innerHTML = NAVS.map(n => `<button class="${V == n[0] || (V == 'pform' || V == 'pdet' || V == 'recap') && n[0] == 'prog' ? 'on' : ''}" onclick="go('${n[0]}')" aria-label="${n[1]}"><span class="ic" aria-hidden="true">${n[2]}</span><span class="lg">${n[1]}</span><span class="sh">${n[3]}</span></button>`).join('');
            $('#fm').innerHTML = MSG ? `<div class="note" role="status">${esc(MSG)}</div>` : ''; MSG = '';
            $('#main').innerHTML = ({home: vHome, lib: vLib, airs: vAirs, prog: vProg, pform: vForm, recap: vRecap, pdet: vDet, dah: vDah, set: vSet}[V])();
            if (V == 'pform') afterForm();
        }
        const empty = (t, b) => `<div class="empty">${t}${b ? '<br><br>' + b : ''}</div>`;
        function panel(h) {const p = $('#panel'); p.hidden = false; p.innerHTML = h}
        function closeP() {const p = $('#panel'); p.hidden = true; p.innerHTML = ''}
        // ---------- ACCUEIL
        function allSched() {return S.p.filter(p => p.status == 'active').flatMap(p => p.sched.map(e => ({...e, pid: p.id, pn: p.name})))}
        function prog(p) {return p.sched.length ? Math.round(p.sched.filter(e => isDone(e.id)).length / p.sched.length * 100) : 0}
        const START = `<div class="card"><h2>Pour commencer</h2><div class="row" style="align-items:stretch"><div class="grow"><span class="num">1</span><br><b>Ajoutez un khassaïde</b><br><span class="mut">Importez son PDF dans la bibliothèque.</span><br><button class="sm" style="margin-top:.5rem" onclick="go('lib')">Ouvrir la bibliothèque</button></div><div class="grow"><span class="num">2</span><br><b>Ajoutez son air</b><br><span class="mut">Audio, vidéo ou lien YouTube.</span><br><button class="sm" style="margin-top:.5rem" onclick="go('airs')">Ajouter un air</button></div><div class="grow"><span class="num">3</span><br><b>Créez un programme</b><br><span class="mut">Choisissez les khassaïdes et les dates.</span><br><button class="sm" style="margin-top:.5rem" onclick="newProg()">Créer un programme</button></div></div><p class="mut" style="margin-bottom:0">Vos données restent privées : elles sont enregistrées sur votre appareil. Le bouton A+ agrandit le texte.</p></div>`;
        function vHome() {
            const td = allSched().filter(e => e.date == today());
            return `<div class="card row">${logoImg('logo')}<div><h1 style="margin:0">Bienvenue sur KY TERWLOU</h1><span class="mut">Lire, apprendre et répéter les khassaïdes de Serigne Touba.</span></div></div>
 ${(!S.k.length && !S.p.length) ? START : ''}<h2>À réciter aujourd'hui</h2>${td.length ? td.map(rowE).join('') : empty('Rien de prévu aujourd\'hui.', S.k.length ? `<button onclick="newProg()">Créer un programme</button>` : `<button onclick="go('lib')">Ajouter un premier khassaïde</button>`)}`
        }
        function rowE(e) {
            const r = sdone(e.id), st = r ? r.st : ''; const it = (S.p.find(p => p.id == e.pid) || {items: []}).items.find(i => i.kid == e.kid);
            return `<div class="card ${st == 'done' ? 'done' : ''}"><div class="row sp"><div class="grow"><b class="t">${esc(KN(e.kid))}</b><br><span class="mut">${esc(e.pn || '')}${e.time ? ' · ' + esc(e.time) : ''}</span></div><div class="row">${it && it.aid ? `<button class="sec sm" onclick="playAir('${it.aid}','audio')">Écouter</button>` : ''}
 <button class="sm ${st == 'done' ? '' : 'sec'}" onclick="mark('${e.id}','done')">${st == 'done' ? 'Effectuée ✓' : 'Marquer effectuée'}</button><button class="sm sec" onclick="mark('${e.id}','partial')">${st == 'partial' ? 'Partielle ✓' : 'Partielle'}</button></div></div></div>`
        }
        function mark(id, st) {const i = S.s.findIndex(x => x.sid == id); if (i >= 0 && S.s[i].st == st) S.s.splice(i, 1); else if (i >= 0) S.s[i].st = st; else S.s.push({sid: id, st, at: new Date().toISOString()}); save(); render()}
        // ---------- BIBLIOTHEQUE
        function kform() {
            const k = ED ? K(ED) : {}; return `<div class="card"><h3>${ED ? 'Modifier le khassaïde' : 'Ajouter un khassaïde PDF'}</h3>
 <label for="kn">Nom du khassaïde</label><input id="kn" value="${esc(k.name)}"><label for="ka">Autres noms (séparés par des virgules)</label><input id="ka" value="${esc((k.aliases || []).join(', '))}">
 <label for="kf">Fichier PDF ${k.pdf ? '(laisser vide pour conserver « ' + esc(k.pdfName) + ' »)' : ''}</label><input type="file" id="kf" accept="application/pdf,.pdf">
 <label for="kd">Description (facultatif)</label><textarea id="kd" rows="2">${esc(k.desc)}</textarea><label for="ks">Statut de publication</label><select id="ks"><option value="published" ${k.status == 'published' ? 'selected' : ''}>Publié</option><option value="draft" ${k.status == 'draft' ? 'selected' : ''}>Brouillon</option></select>
 <div class="row" style="margin-top:.8rem"><button onclick="saveK()">Enregistrer</button><button class="sec" onclick="ED=null;SHOW=false;render()">Annuler</button></div></div>`}
        async function saveK() {
            try {
                const n = $('#kn').value.trim(); if (!n) return flash('Saisissez le nom du khassaïde.');
                if (S.k.some(k => k.id != ED && norm(k.name) == norm(n))) return flash('Ce khassaïde existe déjà dans la bibliothèque : modifiez sa fiche au lieu d\'en créer une autre.');
                const f = $('#kf').files[0]; if (f && !/pdf$/i.test(f.name) && f.type != 'application/pdf') return flash('Le fichier doit être un PDF.');
                let k = ED ? K(ED) : null; if (!k) {k = {id: uid(), aliases: [], added: today()}; S.k.push(k)}
                if (f) {await fdel(k.pdf); k.pdf = await store(f); k.pdfName = f.name}
                k.name = n; k.aliases = $('#ka').value.split(',').map(x => x.trim()).filter(Boolean); k.desc = $('#kd').value.trim(); k.status = $('#ks').value; save(); ED = null; SHOW = false; MSG = 'Khassaïde enregistré.'; render()
            } catch (e) {flash(e.message || 'Échec de l\'enregistrement.')}
        }
        function listK() {
            const q = norm(Q), l = S.k.filter(k => !q || norm(k.name + ' ' + k.aliases.join(' ')).includes(q));
            if (!S.k.length) return empty('La bibliothèque est vide.', 'Cliquez sur « Ajouter un khassaïde PDF » pour commencer.'); if (!l.length) return empty('Aucun résultat pour « ' + esc(Q) + ' ».');

            const calHtml = () => {
                if (!p.sched.length) return empty('Aucun calendrier pour l\'instant.', 'Utilisez « Répartir automatiquement » : vous pourrez modifier la proposition avant de la valider.'); const g = {}; p.sched.forEach(e => (g[grp(p, e.date)] = g[grp(p, e.date)] || []).push(e));
                return Object.entries(g).map(([t, l]) => `<div class="card"><h3>${esc(t)}</h3>${l.map(e => `<div class="row sp ${isDone(e.id) ? 'done' : ''}" style="margin-bottom:.4rem"><span class="grow t">${esc(KN(e.kid))}</span><input type="date" style="width:160px" value="${e.date}" aria-label="Date" onchange="chDate('${p.id}','${e.id}',this.value)"><button class="sm ${isDone(e.id) ? '' : 'sec'}" onclick="mark('${e.id}','done')">${isDone(e.id) ? 'Fait ✓' : 'Marquer fait'}</button></div>`).join('')}</div>`).join('')
            };
            const cards = p.items.map((it, i) => {
                const a = it.aid && A(it.aid), k = K(it.kid); return `<div class="card"><div class="row"><span class="num">${i + 1}</span><div class="grow"><h3 style="margin:0">${esc(KN(it.kid))}</h3><span class="mut">Air : ${a ? esc(a.name) + (a.reciter ? ' · ' + esc(a.reciter) : '') : '<b>aucun air choisi</b>'}</span></div></div>
  <div class="row noprint" style="margin:.5rem 0">${k && k.pdf ? `<button class="sm sec" onclick="openPdf('${k.id}')">Lire le document</button>` : '<span class="badge w">PDF non disponible</span>'}${a && (a.audio) ? `<button class="sm" onclick="playAir('${a.id}','audio')">Écouter</button>` : ''}${a && (a.video || a.yt) ? `<button class="sm" onclick="playAir('${a.id}','video')">Regarder la vidéo</button>` : ''}</div>
  <div class="noprint">${itemRow2(p, i)}</div></div>`
            }).join('');
            const add = S.k.filter(k => !p.items.some(i => i.kid == k.id));
            return `<div class="pr">${logoImg('logo')}<h2 style="margin:0">KY TERWLOU</h2></div><button class="sec sm noprint" onclick="go('prog')">← Mes programmes</button><h1>Détail du programme</h1>
 <div class="card"><h2>${esc(p.name)}</h2><span class="badge">${ST[p.status]}</span><p>${p.type == 'dahira' ? 'Dahira : ' + esc(p.dahira || '—') + '<br>' : ''}${p.manager ? 'Responsable : ' + esc(p.manager) + '<br>' : ''}Période : ${PER[p.period]} · du ${fmt(p.start)} au ${fmt(p.end)}<br>${p.items.length} khassaïde(s)${p.obj ? ' · objectif : ' + p.obj + ' répétition(s)' : ''}</p>${p.desc ? `<p>${esc(p.desc)}</p>` : ''}<div class="bar"><i style="width:${prog(p)}%"></i></div><b>${prog(p)} %</b> réalisé</div>
 <div class="row noprint" style="margin-bottom:1rem"><button class="sm sec" onclick="editP('${p.id}')">Modifier</button>${p.status == 'draft' ? `<button class="sm" onclick="setSt('${p.id}','active')">Activer</button>` : ''}<button class="sm sec" onclick="dup('${p.id}')">Dupliquer</button><button class="sm sec" onclick="setSt('${p.id}','${p.status == 'archived' ? 'active' : 'archived'}')">${p.status == 'archived' ? 'Désarchiver' : 'Archiver'}</button><button class="sm sec" onclick="print()">Imprimer / exporter en PDF</button><button class="sm sec" onclick="share('${p.id}')">Partager</button><button class="sm bad" onclick="delP('${p.id}')">Supprimer</button></div><div id="ed"></div><div id="sh"></div>
 <h2>Khassaïdes à réciter</h2>${cards || empty('Aucun khassaïde dans ce programme.')}
 <div class="card noprint"><label for="ad2">Ajouter un khassaïde</label><div class="row"><select id="ad2" class="grow"><option value="">Choisir…</option>${add.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select><button onclick="addTo('${p.id}')">Ajouter</button></div></div>
 <h2>Calendrier</h2><div class="row noprint" style="margin-bottom:.6rem"><button class="sm" onclick="auto('${p.id}')">Répartir automatiquement</button></div>${PROP ? `<div class="card"><h3>Proposition</h3><p>${PROP.length} séance(s) du ${fmt(PROP[0].date)} au ${fmt(PROP[PROP.length - 1].date)}. Appliquer remplace le calendrier actuel.</p><div class="row"><button class="sm" onclick="applyProp('${p.id}')">Appliquer</button><button class="sm sec" onclick="PROP=null;render()">Annuler</button></div></div>` : ''}${calHtml()}`
        }
        function itemRow2(p, i) {const it = p.items[i], l = airsOf(it.kid); return `<div class="row">${l.length ? `<select style="width:auto" aria-label="Changer l'air" onchange="p_air('${p.id}',${i},this.value)"><option value="">Air non choisi</option>${l.map(a => `<option value="${a.id}" ${it.aid == a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>` : ''}<button class="sm sec" onclick="p_mv('${p.id}',${i},-1)">↑</button><button class="sm sec" onclick="p_mv('${p.id}',${i},1)">↓</button><button class="sm bad" onclick="p_rm('${p.id}',${i})">Retirer</button></div>`}
        const PP = id => S.p.find(p => p.id == id);
        function p_air(id, i, v) {PP(id).items[i].aid = v; save(); render()}
        function p_mv(id, i, d) {const a = PP(id).items, j = i + d; if (j < 0 || j >= a.length) return;[a[i], a[j]] = [a[j], a[i]]; save(); render()}
        function p_rm(id, i) {const p = PP(id), k = p.items[i].kid; if (!confirm('Retirer « ' + KN(k) + ' » du programme ?')) return; p.items.splice(i, 1); p.sched = p.sched.filter(e => e.kid != k); save(); render()}
        function addTo(id) {const k = $('#ad2').value; if (!k) return; const l = airsOf(k); PP(id).items.push({kid: k, aid: l[0] ? l[0].id : ''}); save(); MSG = 'Ajouté. Relancez la répartition du calendrier pour le planifier.'; render()}
        function chDate(pid, eid, d) {PP(pid).sched.find(e => e.id == eid).date = d; save(); MSG = 'Date modifiée.'; render()}
        function auto(id) {const p = PP(id); if (!p.items.length) return flash('Ajoutez d\'abord des khassaïdes.'); PROP = genSched({start: p.start, end: p.end, days: p.days || [0, 1, 2, 3, 4, 5, 6]}, p.items); if (!PROP.length) {flash('Aucune date ne correspond.'); return } render()}
        function applyProp(id) {const p = PP(id); p.sched = PROP; PROP = null; save(); MSG = 'Calendrier appliqué. Vous pouvez encore modifier chaque date.'; render()}
        function editP(id) {
            const p = PP(id); $('#ed').innerHTML = `<div class="card"><h3>Modifier le programme</h3><label for="en">Nom</label><input id="en" value="${esc(p.name)}"><label for="ed1">Dahira</label><input id="ed1" value="${esc(p.dahira)}"><label for="em">Responsable</label><input id="em" value="${esc(p.manager)}"><label for="eo">Objectif (répétitions)</label><input id="eo" type="number" min="1" value="${p.obj || ''}"><label for="ede">Description</label><textarea id="ede" rows="2">${esc(p.desc)}</textarea>
 <div class="row" style="margin-top:.6rem"><button onclick="saveE('${id}')">Enregistrer</button><button class="sec" onclick="render()">Annuler</button></div></div>`
        }
        function saveE(id) {const p = PP(id), n = $('#en').value.trim(); if (!n) return flash('Le nom ne peut pas être vide.'); Object.assign(p, {name: n, dahira: $('#ed1').value.trim(), manager: $('#em').value.trim(), obj: +$('#eo').value || '', desc: $('#ede').value.trim()}); save(); MSG = 'Programme modifié.'; render()}
        function share(id) {const p = PP(id); const t = `${p.name}\n${p.type == 'dahira' ? 'Dahira : ' + p.dahira + '\n' : ''}Du ${fmt(p.start)} au ${fmt(p.end)}\n\n` + p.items.map((it, i) => `${i + 1}. ${KN(it.kid)}${it.aid ? ' (air : ' + A(it.aid).name + ')' : ''}`).join('\n'); $('#sh').innerHTML = `<div class="card"><label for="st">Copiez ce résumé pour l'envoyer à votre dahira</label><textarea id="st" class="code" readonly>${esc(t)}</textarea><p class="mut">Le partage direct avec les membres d'un dahira nécessitera les comptes (version avec serveur).</p></div>`}
        // ---------- DAHIRAS
        function vDah() {
            return `<h1>Dahiras</h1><details class="card"><summary><b>Créer un dahira</b></summary><label for="dn">Nom</label><input id="dn"><label for="dl2">Localité</label><input id="dl2"><label for="dr">Responsable</label><input id="dr"><br><button onclick="addD()">Créer le dahira</button></details>
 ${S.d.length ? S.d.map(d => {
                const ps = S.p.filter(p => p.dahira == d.name); return `<div class="card"><h3>${esc(d.name)}</h3><span class="mut">${esc(d.loc || '')}${d.resp ? ' · Responsable : ' + esc(d.resp) : ''} · ${ps.length} programme(s)</span><p><b>Membres :</b> ${d.members.length ? d.members.map(m => `<span class="badge">${esc(m.n)} · ${{admin: 'Responsable', member: 'Membre'}[m.r]}</span>`).join(' ') : '<span class="mut">aucun</span>'}</p>
 <div class="row"><input id="mn${d.id}" class="grow" placeholder="Nom du membre" aria-label="Nom du membre"><select id="mr${d.id}" style="width:auto" aria-label="Rôle"><option value="member">Membre</option><option value="admin">Responsable</option></select><button class="sm" onclick="addMb('${d.id}')">Ajouter</button><button class="sm bad" onclick="delD('${d.id}')">Supprimer</button></div></div>`
            }).join('') : empty('Aucun dahira.', 'Créez-en un pour y rattacher vos programmes collectifs.')}`
        }
        function addD() {const n = $('#dn').value.trim(); if (!n) return flash('Saisissez le nom du dahira.'); S.d.push({id: uid(), name: n, loc: $('#dl2').value.trim(), resp: $('#dr').value.trim(), members: []}); save(); MSG = 'Dahira créé.'; render()}
        function addMb(id) {const n = $('#mn' + id).value.trim(); if (!n) return; S.d.find(d => d.id == id).members.push({n, r: $('#mr' + id).value}); save(); render()}
        function delD(id) {if (confirm('Supprimer ce dahira ?')) {S.d = S.d.filter(d => d.id != id); save(); render()} }
        // ---------- REGLAGES
        function vSet() {
            return `<h1>Réglages</h1><div class="card"><h3>Identité visuelle</h3><div class="row">${logoImg('logo')}<span class="mut">${S.logo ? 'Logo importé.' : 'Emplacement réservé : aucun logo officiel n\'est inclus. Importez le fichier officiel dès qu\'il est disponible.'}</span></div>
 <label for="lg">Importer ou remplacer le logo (image)</label><input type="file" id="lg" accept="image/*" onchange="setLogo(this.files[0])">${S.logo ? '<button class="sm bad" style="margin-top:.5rem" onclick="S.logo=\'\';save();render()">Retirer le logo</button>' : ''}</div>
 <div class="card"><h3>Mes données</h3><div class="note">Les données et fichiers sont enregistrés sur cet appareil uniquement. La sauvegarde ci-dessous contient les informations (fiches, airs, programmes), pas les fichiers PDF, audio et vidéo.</div><div class="row"><button class="sec sm" onclick="exp()">Afficher la sauvegarde</button><button class="sec sm" onclick="imp()">Restaurer depuis le texte</button></div><div id="bk"></div></div>`}
        function setLogo(f) {if (!f) return; const r = new FileReader(); r.onload = () => {const im = new Image(); im.onload = () => {const c = document.createElement('canvas'), s = Math.min(1, 256 / Math.max(im.width, im.height)); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); S.logo = c.toDataURL('image/png'); save(); MSG = 'Logo enregistré.'; render()}; im.onerror = () => flash('Image illisible.'); im.src = r.result}; r.readAsDataURL(f)}
        function exp() {$('#bk').innerHTML = `<label for="bt">Copiez ce texte pour sauvegarder</label><textarea id="bt" class="code" readonly>${esc(JSON.stringify(S))}</textarea>`}
        function imp() {$('#bk').innerHTML = `<label for="bt">Collez une sauvegarde</label><textarea id="bt" class="code"></textarea><br><button onclick="doImp()">Restaurer</button>`}
        function doImp() {try {const o = JSON.parse($('#bt').value); if (!Array.isArray(o.k) || !Array.isArray(o.p)) throw 0; S = {...DEF, ...o}; save(); MSG = 'Données restaurées (les fichiers joints ne sont pas inclus).'; render()} catch (e) {flash('Texte invalide : rien n\'a été restauré.')} }
        render();
    </script>
</body>

</html>
